<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة الوحدة الثانية – الصف السادس الابتدائي | محترف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f2a8f;--blue:#3b73c8;--gold:#ffb94a;--pink:#ff6f91;--green:#22b573;--red:#ff5252;--ink:#1d2350}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Cairo',Tahoma,sans-serif;font-weight:800;color:var(--ink);font-size:20px;
background:linear-gradient(120deg,#bfe3ff,#e3d4ff,#ffe3c2,#c9f2e3,#bfe3ff);background-size:400% 400%;animation:bg 22s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.fl{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fl span{position:absolute;bottom:-60px;font-size:34px;opacity:.55;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg)}}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:4px solid var(--gold)}
header img{width:54px;height:54px;border-radius:50%;border:3px solid var(--navy);background:#fff}
header h1{flex:1;font-family:Lalezar,Cairo;font-weight:400;font-size:22px;color:var(--navy);line-height:1.1}
.ib{border:0;background:var(--gold);width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #d98e1c}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border:4px solid var(--navy);border-radius:28px;padding:20px;box-shadow:0 8px 0 var(--navy);animation:in .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{transform:scale(.9) translateY(20px);opacity:0}}
h2{font-family:Lalezar,Cairo;font-weight:400;font-size:30px;color:var(--navy);line-height:1.3}
.btn{border:0;font:inherit;font-size:22px;color:#fff;background:var(--blue);padding:12px 26px;border-radius:50px;cursor:pointer;box-shadow:0 6px 0 #25508f;transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #25508f}
.btn.g{background:var(--green);box-shadow:0 6px 0 #14804f}.btn.o{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 #d98e1c}
.btn:focus-visible,.opt:focus-visible,.ib:focus-visible,.tile:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.hero{text-align:center}
.hero .logo{width:170px;height:170px;border-radius:50%;border:6px solid var(--navy);background:#fff;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-3deg)}}
.hero input{font:inherit;font-size:24px;width:min(100%,380px);padding:12px 18px;border-radius:50px;border:4px solid var(--blue);text-align:center;margin:14px 0;color:var(--ink)}
.bot{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bot i{font-style:normal;font-size:56px;animation:bob 2.4s ease-in-out infinite}
.bot p{background:#fff;border:4px solid var(--navy);border-radius:22px;padding:10px 16px;font-size:21px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.tile{border:4px solid var(--navy);border-radius:26px;padding:16px 10px;text-align:center;font:inherit;font-size:20px;color:#fff;cursor:pointer;box-shadow:0 7px 0 var(--navy);transition:transform .15s;line-height:1.35}
.tile:hover{transform:translateY(-5px) rotate(-1.5deg)}.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
.tile b{display:block;font-size:50px;font-weight:400;margin-bottom:4px}
.sec{font-family:Lalezar,Cairo;font-weight:400;font-size:26px;color:var(--navy);margin:6px 4px 12px}
.c0{background:#ff7a59}.c1{background:#8b5cf6}.c2{background:#14b8a6}.c3{background:#3b82f6}.c4{background:#ec4899}.c5{background:#f59e0b;color:var(--ink)}
.slide{text-align:center}.slide .big{font-size:78px;display:block;animation:bob 2.6s ease-in-out infinite}
.slide ul{list-style:none;padding:0;text-align:right;margin-top:12px}
.slide li{background:#eef5ff;border:3px dashed var(--blue);border-radius:18px;padding:10px 16px;margin:10px 0;line-height:1.7;opacity:0;animation:li .5s forwards}
@keyframes li{from{transform:translateX(30px)}to{opacity:1;transform:none}}
.tip{background:#e6fff3;border:3px solid var(--green);border-radius:18px;padding:12px 16px;margin-top:14px;text-align:right;line-height:1.7;opacity:0;animation:li .5s 1.6s forwards}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.dots{display:flex;gap:7px}.dots i{width:14px;height:14px;border-radius:50%;background:#cfd8ee}.dots i.on{background:var(--pink);transform:scale(1.35)}
.meta{display:flex;justify-content:space-between;font-size:17px;color:var(--blue)}
.bar{height:16px;background:#dde6fb;border-radius:20px;margin:8px 0 14px;overflow:hidden;border:2px solid var(--navy)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .4s}
.q{margin:6px 0 16px;line-height:1.7}
.opts{display:grid;gap:12px}.opts.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-size:21px;text-align:right;color:var(--ink);background:#f4f7ff;border:4px solid var(--blue);border-radius:20px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:transform .12s}
.opts.two .opt{justify-content:center;font-size:26px;padding:20px}
.opt:hover:not(:disabled){transform:scale(1.03);background:#e5eeff}
.opt b{background:var(--navy);color:#fff;min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.opt.good{background:#d4f8e6;border-color:var(--green);animation:jump .5s}.opt.bad{background:#ffe0e0;border-color:var(--red);animation:shake .5s}
@keyframes jump{40%{transform:scale(1.08) rotate(-2deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.fb{margin-top:16px;padding:12px 16px;border-radius:18px;line-height:1.7;animation:in .4s}.fb.ok{background:#d4f8e6;color:#0d6b40}.fb.no{background:#ffe9e9;color:#a31616}
.fb .btn{display:block;margin:12px auto 0}
.sortitem{font-size:30px;text-align:center;background:#fff7e0;border:4px dashed var(--gold);border-radius:22px;padding:28px 12px;margin:10px 0 18px;animation:in .4s;line-height:1.5}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.flash{position:fixed;inset:0;z-index:20;pointer-events:none;animation:fl .5s forwards}
.flash.ok{background:radial-gradient(circle,transparent 40%,rgba(34,181,115,.45))}.flash.no{background:radial-gradient(circle,transparent 40%,rgba(255,82,82,.5))}
@keyframes fl{to{opacity:0}}
.pop{position:fixed;left:50%;top:42%;z-index:21;font-size:120px;pointer-events:none;animation:pop .9s forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}30%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
.cf{position:fixed;top:-20px;width:12px;height:16px;z-index:22;pointer-events:none;animation:cf 1.8s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.end{text-align:center}.end .stars{font-size:64px;letter-spacing:6px}.end .score{font-family:Lalezar;font-weight:400;font-size:54px;color:var(--pink)}
.end .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:520px){body{font-size:18px}h2{font-size:25px}.slide .big{font-size:60px}.opts.two{grid-template-columns:1fr 1fr}.opt{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

function menu(){const cl=['c0','c1','c2','c3'];
app.innerHTML=`<div class="bot"><i>🤖</i><p>أهلًا ${nm()}! اختر الدرس الذي تريد مراجعته، أو ابدأ الاختبارات مباشرة 💪</p></div>
<div class="sec">📖 دروس الوحدة الثانية</div><div class="grid">${LESSONS.map((l,i)=>`<button class="tile ${cl[i]}" data-l="${i}"><b>${l.ico}</b>${l.t}</button>`).join('')}</div>
<div class="sec">📝 أسئلة الكتاب (اختبارات سلاح التلميذ)</div><div class="grid">${TESTS.map((t,i)=>`<button class="tile ${['c4','c5','c2','c1'][i]}" data-t="${i}"><b>${['1️⃣','2️⃣','3️⃣','4️⃣'][i]}</b>الاختبار ${['الأول','الثاني','الثالث','الرابع'][i]}<br><small>${t.tf.length+t.mc.length} سؤال</small></button>`).join('')}<button class="tile c0" data-t="all"><b>🏆</b>تحدّي الأبطال<br><small>كل الأسئلة (${TESTS.reduce((a,t)=>a+t.tf.length+t.mc.length,0)})</small></button></div>`;
app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{sfx.click();lesson(+b.dataset.l,0)});
app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sfx.click();quiz(b.dataset.t)});scrollTo(0,0)}
function lesson(li,si){const L=LESSONS[li],s=L.slides[si],n=L.slides.length;
app.innerHTML=`<div class="card slide"><span class="big">${s.e}</span><h2>${s.h}</h2><ul>${s.l.map((x,i)=>`<li style="animation-delay:${i*.35}s">${x}</li>`).join('')}</ul>${s.tip?`<div class="tip">${s.tip}</div>`:''}
<div class="nav"><button class="btn" id="pv" ${si?'':'disabled style="opacity:.4"'}>▶ السابق</button><div class="dots">${L.slides.map((_,i)=>`<i class="${i==si?'on':''}"></i>`).join('')}</div><button class="btn g" id="nx">${si<n-1?'التالي ◀':'تم ✔'}</button></div></div>`;
$('#pv').onclick=()=>{sfx.click();lesson(li,si-1)};
$('#nx').onclick=()=>{sfx.click();si<n-1?lesson(li,si+1):L.game?sort(li):done(li)};scrollTo(0,0)}
function sort(li){const g=LESSONS[li].game,it=shuf(g.i);let k=0,sc=0;
const draw=()=>{app.innerHTML=`<div class="card"><h2>${g.h}</h2><div class="meta"><span>اختر المجموعة الصحيحة</span><span>${k+1}/${it.length}</span></div><div class="bar"><i style="width:${k/it.length*100}%"></i></div><div class="sortitem">${it[k][0]}</div><div class="cats">${g.c.map((c,i)=>`<button class="btn ${['','g','o'][i]}" data-c="${i}">${c}</button>`).join('')}</div></div>`;
app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.c==it[k][1];fx(ok);if(ok)sc++;if(++k<it.length)setTimeout(draw,ok?700:1000);else setTimeout(()=>done(li,sc,it.length),900)})};draw()}
function done(li,sc,tot){app.innerHTML=`<div class="card end"><div class="stars">🎊</div><h2>أحسنت يا ${nm()}! أنهيت درس «${LESSONS[li].t}»</h2>${tot?`<div class="score">${sc} / ${tot}</div>`:''}<div class="row"><button class="btn o" id="m">القائمة 🏠</button><button class="btn g" id="r">أعد الدرس 🔁</button></div></div>`;sfx.win();confetti(60);$('#m').onclick=menu;$('#r').onclick=()=>lesson(li,0)}
function quiz(id){const T=id=='all'?TESTS:[TESTS[id]],base=id=='all'?0:+id;let items=[];
T.forEach((t,ti)=>{const n='الاختبار '+['الأول','الثاني','الثالث','الرابع'][id=='all'?ti:base];t.tf.forEach(x=>items.push({p:n+' • ضع علامة ✓ أو ✗',q:x[0],o:TF,a:x[1]?0:1,tf:1}));t.mc.forEach(x=>items.push({p:n+' • اختر الإجابة الصحيحة',q:x[0],o:x[1],a:x[2]}))});
let i=0,sc=0;
const draw=()=>{const q=items[i];app.innerHTML=`<div class="card"><div class="meta"><span>${q.p}</span><span>${i+1}/${items.length} • ⭐ ${sc}</span></div><div class="bar"><i style="width:${i/items.length*100}%"></i></div><h2 class="q">${q.q}</h2><div class="opts ${q.tf?'two':''}">${q.o.map((x,k)=>`<button class="opt" data-k="${k}">${q.tf?'':`<b>${'أبجد'[k]}</b>`}<span>${x}</span></button>`).join('')}</div><div id="fb" aria-live="polite"></div></div>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k==q.a;app.querySelectorAll('.opt').forEach(x=>x.disabled=true);app.querySelectorAll('.opt')[q.a].classList.add('good');if(!ok)b.classList.add('bad');if(ok)sc++;fx(ok);
$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?`${rnd(praise)} يا ${nm()}! إجابة صحيحة 🎉`:`ليست المرة الأخيرة! 💪 الإجابة الصحيحة: <u>${q.o[q.a]}</u>`}<button class="btn ${ok?'g':'o'}" id="nx">${i<items.length-1?'السؤال التالي ◀':'اعرض النتيجة 🏁'}</button></div>`;
$('#nx').onclick=()=>{sfx.click();++i<items.length?draw():fin()};$('#nx').focus()})};
const fin=()=>{const p=Math.round(sc/items.length*100),st=p>=90?3:p>=70?2:p>=50?1:0;
app.innerHTML=`<div class="card end"><div class="stars">${'⭐'.repeat(st)||'💪'}</div><h2>${p>=90?'أنت بطل خارق':p>=70?'أداء رائع':p>=50?'أحسنت، حاول مرة أخرى':'لا بأس، المراجعة تصنع الأبطال'} يا ${nm()}!</h2><div class="score">${sc} / ${items.length}</div><p>نسبتك ${p}%</p><div class="row"><button class="btn g" id="rt">أعد الاختبار 🔁</button><button class="btn o" id="m">القائمة 🏠</button></div></div>`;
p>=50?(sfx.win(),confetti(70)):sfx.bad();$('#rt').onclick=()=>quiz(id);$('#m').onclick=menu;scrollTo(0,0)};draw();scrollTo(0,0)}
start();
</script>
</body></html>
